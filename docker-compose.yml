services:
  postgres:
    image: postgres:15-alpine
    container_name: fleetly_postgres
    restart: always
    environment:
      POSTGRES_USER: fleetly_admin
      POSTGRES_PASSWORD: SecretPassword123!
      POSTGRES_DB: fleetly_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fleetly_network

networks:
  fleetly_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
